# Local development database. Dev-only credentials: never reuse them anywhere real.
services:
  db:
    image: postgres:18-alpine
    container_name: obscura-db
    environment:
      POSTGRES_USER: obscura
      POSTGRES_PASSWORD: obscura_dev
      POSTGRES_DB: obscura
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - obscura-pgdata:/var/lib/postgresql
      - ./db/docker-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U obscura -d obscura"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  obscura-pgdata:
